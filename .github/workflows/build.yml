name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # هذه الخطوة السحرية ستقوم بإنشاء مجلد الأندرويد تلقائياً
      - name: Generate Android Files
        run: |
          flutter create --platforms=android --project-name fadnia_library --org com.fadnia .
          
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fadnia-Library-APK
          path: build/app/outputs/flutter-apk/app-release.apk
