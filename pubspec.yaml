name: fadnia_library
description: مكتبة مدرسة الفادنية شرق - تعمل عبر الواي فاي بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  http: ^1.2.0
  network_info_plus: ^5.0.0
  file_picker: ^8.0.0
  open_filex: ^4.5.0
  permission_handler: ^11.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
